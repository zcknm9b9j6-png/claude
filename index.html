<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14B4C8" />
    <title>Fair Play OOSH · Task Tracker</title>
    <meta
      name="description"
      content="Fair Play OOSH task tracker — weekly, term, yearly and project trackers driven by NSW school term dates."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Opening splash — pure CSS, fades itself out (no plugin needed). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(135deg, #e9f9fb 0%, #fde6f3 100%);
        animation: splash-out 0.6s ease forwards;
        animation-delay: 1.7s;
      }
      #splash img {
        width: 160px;
        height: auto;
        animation: splash-pop 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash .splash-word {
        font-family: "Fredoka", system-ui, sans-serif;
        font-weight: 600;
        color: #14b4c8;
        letter-spacing: 0.5px;
        opacity: 0;
        animation: splash-fade 0.8s ease 0.5s both;
      }
      @keyframes splash-pop {
        0% { opacity: 0; transform: scale(0.6) translateY(10px); }
        60% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash { animation-delay: 0.2s; }
        #splash img, #splash .splash-word { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="./logo.svg" alt="Fair Play OOSH" />
      <div class="splash-word">Fair Play OOSH</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
