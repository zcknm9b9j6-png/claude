<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14B4C8" />
    <title>Fair Play OOSH · Task Tracker</title>
    <meta
      name="description"
      content="Fair Play OOSH task tracker — weekly, term, yearly and project trackers driven by NSW school term dates."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Instant pastel placeholder painted before the bundle loads, so there's
         no white flash. The React <Splash> renders its Lottie animation on top
         of this same backer and removes this element once it mounts. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        background: linear-gradient(135deg, #e9f9fb 0%, #fde6f3 100%);
      }
    </style>
  </head>
  <body>
    <div id="splash"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
