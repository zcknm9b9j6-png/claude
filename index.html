<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14B4C8" />
    <title>Fair Play OOSH · Task Tracker</title>
    <meta
      name="description"
      content="Personal task tracker for Fair Play OOSH — weekly, term, yearly and project trackers driven by NSW school term dates."
    />
    <style>
      /* Opening splash — pure CSS, fades itself out (no plugin needed). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e9f9fb 0%, #fde6f3 100%);
        animation: splash-out 0.6s ease forwards;
        animation-delay: 1.5s;
      }
      #splash img {
        width: 150px;
        height: auto;
        animation: splash-pop 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes splash-pop {
        0% { opacity: 0; transform: scale(0.6) translateY(10px); }
        60% { opacity: 1; transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-out {
        to { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { animation-delay: 0.2s; }
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash"><img src="logo.png" alt="Fair Play OOSH" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
