<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-label="Fair Play OOSH">
  <defs>
    <style>
      .ltr { font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Top row: FAIR tiles -->
  <g>
    <rect x="24"  y="20" width="96" height="96" rx="14" fill="#EC008C"/>
    <rect x="132" y="20" width="96" height="96" rx="14" fill="#8DC63F"/>
    <rect x="240" y="20" width="96" height="96" rx="14" fill="#27AAE1"/>
    <rect x="348" y="20" width="96" height="96" rx="14" fill="#8DC63F"/>
    <g class="ltr" fill="#ffffff" font-size="66" text-anchor="middle">
      <text x="72"  y="90">F</text>
      <text x="180" y="90">A</text>
      <text x="288" y="90">I</text>
      <text x="396" y="90">R</text>
    </g>
  </g>

  <!-- Middle: PLAY in solid brand colours -->
  <g class="ltr" font-size="150" text-anchor="middle">
    <text x="70"  y="270" fill="#27AAE1">P</text>
    <text x="170" y="270" fill="#F58220">L</text>
    <text x="270" y="270" fill="#92278F">A</text>
    <text x="378" y="270" fill="#EC008C">Y</text>
  </g>

  <!-- Bottom: OOSH on a green bar -->
  <rect x="24" y="322" width="432" height="92" rx="16" fill="#8DC63F"/>
  <text class="ltr" x="240" y="388" fill="#ffffff" font-size="72"
        text-anchor="middle" letter-spacing="6">OOSH</text>
</svg>
